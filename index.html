<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider-Man 2 City Map</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-kicker">Marvel's</span>
          <h1>Spider-Man 2</h1>
        </div>
        <div class="status-row">
          <span class="status-indicator"></span>
          <span>Citywide Patrol</span>
        </div>
      </header>

      <main class="app-layout">
        <section class="map-panel">
          <div class="map-header">
            <div>
              <p class="eyebrow">Manhattan Overview</p>
              <h2>City Grid</h2>
            </div>
            <div class="legend">
              <span><i class="dot red"></i> Crisis</span>
              <span><i class="dot blue"></i> Safe Zone</span>
              <span><i class="dot gold"></i> Landmark</span>
            </div>
          </div>

          <svg id="cityMap" viewBox="0 0 1200 760" role="img" aria-label="Spider-Man 2 city map">
            <defs>
              <linearGradient id="mapGlow" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" stop-color="#1d2d57" />
                <stop offset="100%" stop-color="#091321" />
              </linearGradient>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0d1523" flood-opacity="0.6"/>
              </filter>
            </defs>

            <rect x="0" y="0" width="1200" height="760" fill="url(#mapGlow)" rx="26" />
            <g id="waterways"></g>
            <g id="districts"></g>
            <g id="routes"></g>
            <g id="landmarks"></g>
          </svg>
        </section>

        <aside class="sidebar">
          <div class="district-card">
            <p class="eyebrow">Selected Zone</p>
            <h3 id="district-name">Midtown</h3>
            <p id="district-description">
              A dense web of towers, rooftops, and high-speed chases. Midtown is where the skyline and security response meet.
            </p>
            <ul id="district-missions" class="mission-list"></ul>
          </div>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
